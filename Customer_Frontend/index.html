<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- 🟢 TAILWIND CSS CDN: Loads utility classes like rounded-xl and shadow-sm -->
    <link rel="stylesheet" href="https://unpkg.com" />
    
    <!-- 🟢 FIXED GOOGLE FONTS PATH: Correctly downloads the Poppins typography assets -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    
    <title>Stationero</title>

    <style>
      /* 🎯 2. SCROLLBAR CLEANUP MATRIX: Preserves your smooth layout settings */
      html, body {
        overflow-y: scroll;
        scrollbar-width: none;
        -ms-overflow-style: none;
        margin: 0;
        padding: 0;
        background-color: #f9fafb; /* Matches her gray-50 layout background */
        color: #1f2937; /* Matches her gray-800 clean body text */
      }
      html::-webkit-scrollbar, body::-webkit-scrollbar {
        display: none !important;
        width: 0 !important;
        background: transparent !important;
      }

      /* 🎯 3. NAVIGATION BAR ARCHITECTURE: Preserves your clean header spacing properties */
      header, .navbar {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        z-index: 9999 !important;
        background-color: rgba(255, 255, 255, 0.95) !important;
        backdrop-filter: blur(8px) !important;
        border-bottom: 1px solid #f0f0f0 !important;
        box-shadow: none !important;
      }
      body {
        padding-top: 60px !important;
      }
      nav, .header-container {
        border-bottom: none !important;
        box-shadow: none !important;
      }

      /* 🎯 4. MOBILE NARROW TIMING DEFAULTS: Keeps your mobile dropdowns compact */
      @media (max-width: 768px) {
        select, 
        select option {
          font-size: 13px !important;
          padding: 8px 12px !important;
          line-height: 1.4 !important;
        }
      }
      
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
<script>
  document.addEventListener('click', function(e) {
    if (e.target.innerText === '☰' || e.target.classList.contains('menu-toggle')) {
      const navLinks = document.querySelector('.nav-links');
      if (navLinks) {
        navLinks.classList.toggle('mobile-open');
      }
    }
  });
</script>



  </body>
</html>
